services:
  mysql:
    container_name: mysql_container
    image: mysql:8.0
    ports:
      # 로컬 PC의 13333 포트 -> 컨테이너의 3306 포트로 연결
      - "13333:3306"
    env_file:
      - .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb.d:/docker-entrypoint-initdb.d
    environment:
      # .env 파일에서 직접 로드하거나 여기에 명시 (현재는 명시된 값 사용)
      - TZ=Asia/Seoul
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    networks:
      - capstone

  backend:
    image: jhh0101/capstone:v1.0.30
    container_name: backend_container
    ports:
      # 로컬 PC의 18888 포트 -> 컨테이너의 8082 포트로 연결
      - "18888:8082"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod

      # 🎯 .env 값 주입 (application.yml의 Placeholder와 일치)
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      
      # 📧 이메일 설정 추가
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}

      # 🔐 OAuth2 설정
      - APP_BASE_URL=${APP_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}

      # DB 접속 URL (Host는 Docker 네트워크 상의 'mysql' 서비스 이름)
      - MYSQL_URL=jdbc:mysql://mysql:3306/capstone?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/capstone?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none # application.yml의ddl-auto 설정을 따르기 위해 none으로 변경
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.MySQL8Dialect # 명시
    depends_on:
      - mysql
    networks:
      - capstone

  frontend:
    image: willy0126/capstone-fe:v1.0.3
    build:
      context: .

    container_name: frontend_container
    ports:
      - "8080:80"
#    volumes: #./Front-End:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - capstone

volumes:
  mysql_data:

networks:
  capstone:
    driver: bridge